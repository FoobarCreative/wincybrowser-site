# Feature List                            Edit, add or remove features to be presented.
features                                  :

  - title                                 : Parent-Approved Websites Only
    description                           : Your child can only visit websites you approve. Complete control over their browsing experience with easy-to-manage website permissions.
    fontawesome_icon_name                 : shield-alt

  - title                                 : Safe Browsing for Kids
    description                           : Built-in parental controls and advanced content filtering keep your kids safe online. Browse with confidence knowing harmful content is blocked.
    fontawesome_icon_name                 : lock

  - title                                 : Age-Appropriate Content
    description                           : Curated search results and kid-friendly websites ensure your child only sees content that's right for their age. Learning and fun, nothing inappropriate.
    fontawesome_icon_name                 : child

  - title                                 : Screen Time Management
    description                           : Set healthy browsing limits with built-in screen time controls and scheduling features. Encourage balanced device usage effortlessly.
    fontawesome_icon_name                 : clock

  - title                                 : Educational Focus
    description                           : Access to quality learning resources and educational content that supports your child's development. Make screen time productive and enriching.
    fontawesome_icon_name                 : graduation-cap

  - title                                 : Easy for Kids to Use
    description                           : Simple, colorful interface designed specifically for children. No complicated menus or confusing options, just safe browsing made fun.
    fontawesome_icon_name                 : smile



